name: Publish to npm

# Tags: stats-vX.Y.Z publishes packages/stats; plugin-vX.Y.Z publishes packages/plugin.
# Prereleases use their identifier as the npm dist-tag (rc, next, beta); plain X.Y.Z uses latest.
on:
  push:
    tags:
      - 'stats-v*'
      - 'plugin-v*'

permissions:
  id-token: write
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 (target of the v6 tag)
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Validate release
        run: scripts/release/validate-release.sh "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - run: pnpm install --frozen-lockfile
      # Build the workspace because the plugin's declaration build resolves stats through its workspace link to packages/stats/dist.
      - run: pnpm build
      # npm itself performs trusted publishing (OIDC, id-token: write) from 11.5.1;
      # `pnpm publish` was not known to, and exits 0 when the version already
      # exists. `npm publish` fails loudly on an existing version.
      - name: Require npm >= 11.5.1
        run: |
          v="$(npm --version)"
          echo "npm $v"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(x => parseInt(x, 10))
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)))
            if (!ok) { console.error(`npm ${process.argv[1]} is below 11.5.1 (no OIDC trusted publishing)`); process.exit(1) }
          ' "$v"
      # Pack with pnpm (rewrites workspace:/catalog: specifiers to real versions; npm
      # would publish them verbatim, e.g. the plugin's dependency on the stats
      # package), refuse a tarball that still has one, then publish that tarball.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          (cd "$PKG" && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          TARBALL="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          [ "$(echo "$TARBALL" | wc -l)" -eq 1 ] || { echo "expected one tarball"; exit 1; }
          if tar -xOzf "$TARBALL" package/package.json | grep -E '"(workspace|catalog):'; then
            echo "::error::packed package.json still contains a workspace:/catalog: specifier"; exit 1
          fi
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
      - name: Publish (npm trusted publishing)
        run: npm publish "$TARBALL" --access public --provenance --tag "$NPM_TAG"
      - run: gh release create "$TAG" --notes-file release-notes.md $PRERELEASE_ARG --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
