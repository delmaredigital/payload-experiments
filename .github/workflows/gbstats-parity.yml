# Compare numerically at the parity tolerance, never by byte diff: fixture
# headers and platform noise must not report drift. All upstream inputs
# (gbstats, SDK cases.json, util.ts and power.ts) move together to main.
# Generate into a temporary directory; never touch committed fixtures.
name: gbstats parity drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install uv==0.7.13
      - name: Generate fixtures from GrowthBook main
        id: gen
        continue-on-error: true
        shell: bash
        run: python3 -I scripts/gbstats-parity/generate.py --ref main --out "$RUNNER_TEMP/fx" 2>&1 | tee "$RUNNER_TEMP/generation.log"
      - name: Compare at the parity tolerance
        id: cmp
        if: steps.gen.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: XP_FIXTURE_DIR="$RUNNER_TEMP/fx" pnpm exec vitest run --project stats tests/parity/parity.test.ts 2>&1 | tee "$RUNNER_TEMP/parity.log"
      - name: Report failure
        if: always() && (steps.gen.outcome == 'failure' || steps.cmp.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GEN_OUTCOME: ${{ steps.gen.outcome }}
        run: |
          date=$(date -u +%F)
          if [ "$GEN_OUTCOME" = failure ]; then
            title="gbstats drift: environment/generation failure $date"
            log="$RUNNER_TEMP/generation.log"
          else
            title="gbstats drift: material change vs main $date"
            log="$RUNNER_TEMP/parity.log"
          fi
          {
            echo "$title"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Last 200 lines:'
            echo '```text'
            tail -n 200 "$log"
            echo '```'
          } > "$RUNNER_TEMP/drift-issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/drift-issue.md"
      - name: Fail when generation or comparison failed
        if: always() && (steps.gen.outcome == 'failure' || steps.cmp.outcome == 'failure')
        run: exit 1
